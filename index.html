<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISHAH — Woven with Intent</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4ede2;color:#171615;font-family:Arial,Helvetica,sans-serif}
.page{min-height:100vh;max-width:1100px;margin:auto;padding:28px 5vw 70px}
.nav{display:flex;align-items:center;justify-content:space-between}
.logo{width:68px;height:68px;border-radius:15px;background:#111;color:#f5eee4;display:grid;place-items:center;font:700 25px Georgia,serif;letter-spacing:-2px;box-shadow:0 3px 10px #0002}
.logo span{color:#c51f3a}
.menu{width:64px;height:64px;border:1px solid #cfc6ba;border-radius:50%;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 18px}
.menu i{height:2px;background:#222;display:block}
.meta{margin-top:115px;display:flex;align-items:center;gap:28px;color:#5f5952;font-size:18px;letter-spacing:7px;text-transform:uppercase}
.meta:before{content:"";width:82px;height:3px;background:#c5223c}
.hero{margin-top:75px;max-width:850px}
h1{font:400 clamp(62px,9vw,110px)/.93 Georgia,serif;letter-spacing:-5px;margin:0}
h1 em{color:#c5223c;font-style:italic}
.copy{max-width:820px;margin-top:65px;font-size:25px;line-height:1.62;color:#615c56}
.actions{display:grid;gap:20px;margin-top:65px}
.btn{height:76px;border-radius:40px;display:flex;align-items:center;justify-content:center;text-decoration:none;text-transform:uppercase;letter-spacing:5px;font-weight:600;font-size:15px}
.primary{background:#111;color:#fff}
.secondary{border:1px solid #cfc6ba;color:#272522;background:transparent}
.arrow{font-size:26px;margin-left:25px}
@media(max-width:600px){
 .page{padding:24px 22px 55px}
 .logo{width:58px;height:58px;font-size:21px}
 .menu{width:58px;height:58px}
 .meta{margin-top:105px;font-size:13px;letter-spacing:5px;gap:18px;line-height:1.8}
 .meta:before{width:55px;min-width:55px}
 .hero{margin-top:65px}
 h1{letter-spacing:-3px}
 .copy{font-size:19px;line-height:1.65;margin-top:48px}
 .actions{margin-top:48px}
 .btn{height:68px;font-size:12px;letter-spacing:3px}
}
</style>
</head>
<body>
<main class="page">
  <nav class="nav">
    <div class="logo"><span>I</span>SHAH</div>
    <div class="menu" aria-label="Menu"><i></i><i></i><i></i></div>
  </nav>

  <section class="meta">EST. 2026 · PAKISTAN</section>

  <section class="hero">
    <h1>Crafted,<br>made with<br><em>intent.</em></h1>
    <p class="copy">
      ISHAH creates refined textiles and everyday essentials with a focus on
      quality, detail and timeless design — made in Pakistan, created for
      people everywhere.
    </p>

    <div class="actions">
      <a class="btn primary" href="#collection">Explore the range <span class="arrow">→</span></a>
      <a class="btn secondary" href="#contact">Request samples</a>
    </div>
  </section>
</main>
</body>
</html>
